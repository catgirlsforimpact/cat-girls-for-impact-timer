<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cat Girls for Impact Timer</title>
<meta name="description" content="A cute Pomodoro timer that works offline.">
<meta name="theme-color" content="#e3d6ff">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cat Girls">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
  :root {
    --ink: #38305a;
    --ink-soft: rgba(56, 48, 90, .64);
    --card: rgba(255, 255, 255, .7);
    --card-solid: #fbf9ff;
    --accent: #7a5fd0;
    --on-accent: #fff;
    --track: rgba(56, 48, 90, .1);
    --chip: rgba(56, 48, 90, .07);
    --shadow: 0 18px 50px rgba(80, 60, 150, .2);
    --font: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold",
      "Nunito", "Quicksand", "Segoe UI", system-ui, sans-serif;
  }
  body[data-theme="grape"]      { --accent: #6a4cc4; --card: rgba(255, 255, 255, .76); --shadow: 0 18px 50px rgba(50, 30, 120, .3); }
  body[data-theme="peach"]      { --accent: #f2615a; --ink: #46302f; --ink-soft: rgba(70, 48, 47, .62); --shadow: 0 18px 50px rgba(120, 60, 40, .18); }
  body[data-theme="strawberry"] { --accent: #e8517f; --ink: #4a2a36; --ink-soft: rgba(74, 42, 54, .62); }
  body[data-theme="matcha"]     { --accent: #4c9a67; --ink: #2f4034; --ink-soft: rgba(47, 64, 52, .64); --shadow: 0 18px 50px rgba(50, 90, 60, .18); }
  body[data-theme="sky"]        { --accent: #3486d6; --ink: #25405c; --ink-soft: rgba(37, 64, 92, .64); --shadow: 0 18px 50px rgba(40, 90, 150, .18); }
  body[data-theme="sunset"]     { --accent: #e5507c; --ink: #4a2a3c; --ink-soft: rgba(74, 42, 60, .64); }
  body[data-theme="gingham"]    { --card: rgba(255, 255, 255, .84); }
  body[data-theme="photo"]      { --card: rgba(255, 255, 255, .78); --shadow: 0 18px 50px rgba(0, 0, 0, .28); }
  body[data-theme="night"] {
    --ink: #f3efff;
    --ink-soft: rgba(243, 239, 255, .68);
    --card: rgba(34, 31, 78, .62);
    --card-solid: #26235a;
    --accent: #c9b6ff;
    --on-accent: #2a2158;
    --track: rgba(255, 255, 255, .14);
    --chip: rgba(255, 255, 255, .1);
    --shadow: 0 18px 50px rgba(0, 0, 0, .4);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background: #bfaef5;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  [hidden] { display: none !important; }

  /* ---------- backgrounds ---------- */
  /* min-height: 100lvh lets the background reach under the iPhone home bar and Safari's toolbar */
  .bg { position: fixed; inset: 0; min-height: 100lvh; z-index: 0; transition: opacity .3s; }
  .bg-peach { background: linear-gradient(160deg, #fff3e8 0%, #ffd9c4 55%, #ffb9a8 100%); }
  .bg-strawberry {
    background-color: #ffcfdc;
    background-image:
      radial-gradient(circle, rgba(255,255,255,.8) 7px, transparent 8px),
      radial-gradient(circle, rgba(255,255,255,.8) 7px, transparent 8px);
    background-size: 48px 48px;
    background-position: 0 0, 24px 24px;
  }
  .bg-matcha { background: linear-gradient(165deg, #f3f9e6 0%, #d2eac4 55%, #a8d6a6 100%); }
  .bg-sky {
    background:
      radial-gradient(ellipse 34px 26px at calc(18% - 18px) calc(15% - 14px), #fff 98%, transparent 100%),
      radial-gradient(ellipse 30px 22px at calc(18% + 22px) calc(15% - 8px), #fff 98%, transparent 100%),
      radial-gradient(ellipse 70px 20px at 18% 15%, #fff 98%, transparent 100%),
      radial-gradient(ellipse 30px 24px at calc(80% - 12px) calc(34% - 12px), rgba(255,255,255,.9) 98%, transparent 100%),
      radial-gradient(ellipse 60px 18px at 80% 34%, rgba(255,255,255,.9) 98%, transparent 100%),
      radial-gradient(ellipse 38px 28px at calc(30% + 10px) calc(84% - 16px), rgba(255,255,255,.85) 98%, transparent 100%),
      radial-gradient(ellipse 30px 20px at calc(30% - 30px) calc(84% - 8px), rgba(255,255,255,.85) 98%, transparent 100%),
      radial-gradient(ellipse 80px 22px at 30% 84%, rgba(255,255,255,.85) 98%, transparent 100%),
      linear-gradient(180deg, #9fd6ff 0%, #d9f0ff 100%);
  }
  .bg-lavender { background: linear-gradient(160deg, #f6f0ff 0%, #dccdff 55%, #bfaef5 100%); }
  .bg-grape {
    background:
      radial-gradient(circle at 18% 12%, rgba(255, 200, 240, .55) 0, transparent 42%),
      radial-gradient(circle at 88% 88%, rgba(140, 200, 255, .45) 0, transparent 46%),
      linear-gradient(160deg, #cdb6ff 0%, #a183f0 55%, #7c5bd8 100%);
  }
  .bg-sunset { background: linear-gradient(180deg, #ffc39a 0%, #ff97a6 50%, #b796ff 100%); }
  .bg-gingham {
    background-color: #fbf8ff;
    background-image:
      linear-gradient(90deg, rgba(150, 115, 235, .3) 50%, transparent 50%),
      linear-gradient(rgba(150, 115, 235, .3) 50%, transparent 50%);
    background-size: 56px 56px;
  }
  .bg-night {
    background-color: #1d1b3f;
    background-image:
      radial-gradient(circle at calc(100% - 64px) 96px, #fff4cf 26px, transparent 27px),
      radial-gradient(circle at 20px 30px, #fff 1.2px, transparent 2px),
      radial-gradient(circle at 96px 112px, rgba(255,255,255,.8) 1px, transparent 1.8px),
      radial-gradient(circle at 150px 58px, #ffe9a8 1.4px, transparent 2.2px),
      radial-gradient(circle at 60px 172px, rgba(255,255,255,.7) 1px, transparent 1.8px),
      linear-gradient(180deg, #1a193b 0%, #3b2f6c 100%);
    background-size: 100% 100%, 200px 200px, 200px 200px, 200px 200px, 200px 200px, 100% 100%;
    background-repeat: no-repeat, repeat, repeat, repeat, repeat, no-repeat;
  }
  .bg-photo { background-color: #3a3336; background-size: cover; background-position: center; }

  /* moving effects: float over the background and drift across the timer, never blocking taps */
  #fx { position: fixed; inset: 0; z-index: 2; width: 100%; height: 100%; pointer-events: none; }

  /* soft shade behind the iPhone status bar when installed */
  @media (display-mode: standalone) {
    .bg::before {
      content: ""; position: absolute; left: 0; right: 0; top: 0;
      height: calc(env(safe-area-inset-top, 0px) + 10px);
      background: linear-gradient(rgba(0, 0, 0, .2), transparent);
    }
  }

  /* ---------- layout ---------- */
  .app {
    position: relative; z-index: 1;
    height: 100vh; height: 100dvh;
    max-width: 440px; margin: 0 auto;
    padding:
      calc(env(safe-area-inset-top, 0px) + 14px)
      calc(env(safe-area-inset-right, 0px) + 16px)
      calc(env(safe-area-inset-bottom, 0px) + 16px)
      calc(env(safe-area-inset-left, 0px) + 16px);
    display: flex; flex-direction: column; gap: 14px;
  }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .brand {
    display: flex; align-items: center; gap: 8px; min-width: 0;
    font-weight: 800; font-size: 15px; line-height: 1.15; white-space: nowrap;
    padding: 7px 16px 7px 9px; border-radius: 999px;
    background: var(--card);
    -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3);
  }
  .brand svg { width: 30px; height: 30px; flex-shrink: 0; color: var(--accent); }
  .brand small { display: block; font-size: 11px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-soft); }
  .cat { fill: currentColor; fill-opacity: .13; stroke: currentColor; stroke-width: 5.5; stroke-linejoin: round; stroke-linecap: round; }
  .cat-line { fill: none; stroke: currentColor; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }

  /* the encouraging message shown when a timer finishes */
  .cheer {
    position: absolute; z-index: 3;
    top: calc(env(safe-area-inset-top, 0px) + 72px);
    left: calc(env(safe-area-inset-left, 0px) + 16px); right: calc(env(safe-area-inset-right, 0px) + 16px);
    display: flex; align-items: center; gap: 12px;
    padding: 14px 12px 14px 16px; border-radius: 24px;
    background: var(--card-solid); box-shadow: 0 0 0 2.5px var(--accent), var(--shadow);
    animation: drop .5s cubic-bezier(.2, 1.3, .4, 1);
  }
  .cheer svg { width: 34px; height: 34px; flex-shrink: 0; color: var(--accent); }
  .cheer p { flex: 1; margin: 0; font-size: 16.5px; font-weight: 700; line-height: 1.35; -webkit-user-select: text; user-select: text; }
  .cheer .by { display: block; margin-top: 4px; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
  .cheer .close-btn { flex-shrink: 0; }
  @keyframes drop { from { opacity: 0; transform: translateY(-14px) scale(.96); } to { opacity: 1; transform: none; } }
  .top-actions { display: flex; gap: 10px; }
  .icon-btn {
    width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--card);
    -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3);
    transition: transform .12s;
  }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn svg { width: 22px; height: 22px; }
  .icon-btn.soft { background: var(--chip); -webkit-backdrop-filter: none; backdrop-filter: none; width: 52px; height: 52px; }

  .card {
    flex: 0 1 auto; min-height: 0; margin-block: auto;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    gap: clamp(12px, 3dvh, 26px);
    padding: 18px 18px 24px;
    border-radius: 36px;
    background: var(--card);
    -webkit-backdrop-filter: blur(22px) saturate(1.4); backdrop-filter: blur(22px) saturate(1.4);
    box-shadow: var(--shadow);
  }

  .tabs {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
    width: 100%; padding: 4px; border-radius: 999px; background: var(--chip);
  }
  .tabs button {
    padding: 10px 4px; border-radius: 999px;
    font-weight: 700; font-size: 14px; white-space: nowrap;
    color: var(--ink-soft);
    transition: background .2s, color .2s;
  }
  .tabs button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }

  .ring-wrap {
    position: relative;
    width: min(100%, 300px, 44vh); width: min(100%, 300px, 44dvh);
    aspect-ratio: 1; flex: 0 1 auto;
  }
  /* Starts at 12 o'clock and is mirrored, so the empty part grows clockwise like a clock hand. */
  .ring { width: 100%; height: 100%; transform: scaleX(-1) rotate(-90deg); display: block; }
  .ring circle { fill: none; stroke-width: 14; }
  .ring .track { stroke: var(--track); }
  .ring .prog { stroke: var(--accent); stroke-linecap: round; }
  .ring-inner {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; padding-bottom: 6px;
  }
  .mascot { width: 29%; height: auto; overflow: visible; color: var(--accent); }
  .time {
    font-size: clamp(44px, 15vw, 66px); line-height: 1; font-weight: 800;
    font-variant-numeric: tabular-nums; letter-spacing: -1px;
  }
  .status { font-size: 15px; font-weight: 600; color: var(--ink-soft); margin-top: 4px; }

  .progress-row { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .dots { display: flex; gap: 0; margin: -6px 0; }
  .dot { display: block; padding: 6px 5px; border-radius: 8px; opacity: .5; transition: opacity .3s, transform .3s; }
  .dot svg { display: block; width: 20px; height: 20px; overflow: visible; }
  .dot:active { transform: scale(.9); }
  .dot path { fill: transparent; stroke: var(--accent); stroke-width: 11; stroke-linejoin: round; transition: fill .3s; }
  .dot.done { opacity: 1; transform: scale(1.12); }
  .dot.done path { fill: var(--accent); }
  .today { font-size: 13.5px; font-weight: 600; color: var(--ink-soft); }

  .controls { display: flex; align-items: center; justify-content: center; gap: 16px; width: 100%; }
  .main-btn {
    flex: 0 1 190px; height: 62px; border-radius: 999px;
    background: var(--accent); color: var(--on-accent);
    font-size: 21px; font-weight: 800; letter-spacing: .3px;
    box-shadow: 0 8px 0 -2px rgba(0, 0, 0, .14), 0 10px 22px rgba(0, 0, 0, .12);
    transition: transform .12s, box-shadow .12s;
  }
  .main-btn:active { transform: translateY(4px); box-shadow: 0 3px 0 -2px rgba(0, 0, 0, .14), 0 4px 10px rgba(0, 0, 0, .12); }

  /* ---------- mascot ---------- */
  /* One set of eyes per timer state: open (ready), focus (focus running), relaxed (break running), sleep (paused). */
  .cat-whisker { fill: none; stroke: currentColor; stroke-width: 3.4; stroke-linecap: round; }
  .mascot .eyes-focus, .mascot .eyes-relaxed, .mascot .eyes-sleep, .mascot .zzz { display: none; }
  .mascot:not([data-mood="idle"]) .eyes-open { display: none; }
  .mascot[data-mood="focus"] .eyes-focus { display: block; }
  .mascot[data-mood="relaxed"] .eyes-relaxed { display: block; }
  .mascot[data-mood="sleep"] .eyes-sleep, .mascot[data-mood="sleep"] .zzz { display: block; }
  .mascot .eyes-open { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }

  /* Small movements that match the state. */
  .mascot .face { transform-box: fill-box; transform-origin: 50% 90%; }
  .mascot[data-mood="idle"] .face { animation: breathe 4s ease-in-out infinite; }
  .mascot[data-mood="focus"] .face { animation: bob 2.8s ease-in-out infinite; }
  .mascot[data-mood="relaxed"] .face { animation: sway 3.6s ease-in-out infinite; }
  .mascot[data-mood="sleep"] .face { animation: breathe 5.5s ease-in-out infinite; }
  .mascot .whisk { transform-box: fill-box; }
  .mascot .whisk-l { transform-origin: 100% 50%; --dir: 1; }
  .mascot .whisk-r { transform-origin: 0% 50%; --dir: -1; }
  .mascot[data-mood="focus"] .whisk { animation: twitch 5s infinite; }
  .mascot[data-mood="focus"] .whisk-r { animation-delay: .12s; }
  .mascot .zzz { animation: float 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.035); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5%); } }
  @keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  @keyframes twitch { 0%, 86%, 100% { transform: rotate(0); } 91% { transform: rotate(calc(var(--dir) * 7deg)); } 96% { transform: rotate(calc(var(--dir) * -3deg)); } }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  @keyframes float { 0%, 100% { opacity: .35; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }
  .pop { animation: pop .5s ease; }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.06); } 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) {
    .pop, .cheer { animation: none !important; }
    .sheet { transition: none !important; }
  }

  /* ---------- sheets ---------- */
  .backdrop {
    position: fixed; inset: 0; z-index: 5; background: rgba(20, 10, 20, .32);
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; z-index: 6; left: 0; right: 0; bottom: 0; margin: 0 auto;
    max-width: 460px; max-height: 86vh; max-height: 86dvh; overflow-y: auto;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    padding: 10px 20px calc(env(safe-area-inset-bottom, 0px) + 22px);
    border-radius: 30px 30px 0 0;
    background: var(--card-solid); color: var(--ink);
    box-shadow: 0 -10px 40px rgba(0, 0, 0, .2);
    transform: translateY(105%); visibility: hidden;
    transition: transform .28s cubic-bezier(.2, .8, .2, 1), visibility 0s .28s;
  }
  .sheet.open { transform: none; visibility: visible; transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
  @media (min-width: 600px) { .sheet { bottom: 24px; border-radius: 30px; } }
  .grabber { width: 42px; height: 5px; border-radius: 3px; background: var(--track); margin: 0 auto 8px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .sheet-head h2 { margin: 0; font-size: 21px; font-weight: 800; }
  .close-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; }
  .close-btn svg { width: 18px; height: 18px; }

  .swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 10px; }
  .swatch { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--ink-soft); text-align: center; line-height: 1.2; }
  .swatch .thumb {
    position: relative; width: 100%; aspect-ratio: 1; border-radius: 18px; overflow: hidden;
    box-shadow: 0 0 0 2px var(--track);
    transition: box-shadow .2s, transform .12s;
  }
  .swatch:active .thumb { transform: scale(.95); }
  .swatch .thumb > span { position: absolute; left: 0; top: 0; width: 300%; height: 300%; transform: scale(.3334); transform-origin: 0 0; }
  .swatch[aria-pressed="true"] { color: var(--ink); }
  .swatch[aria-pressed="true"] .thumb { box-shadow: 0 0 0 4px var(--accent); }
  .thumb.empty { display: grid; place-items: center; background: var(--chip); }
  .thumb.empty svg { width: 30px; height: 30px; opacity: .7; }
  .sub { margin: 20px 0 10px; font-size: 16px; font-weight: 800; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 10px 16px; border-radius: 999px; background: var(--chip);
    font-weight: 700; font-size: 14.5px; color: var(--ink-soft);
    transition: background .2s, color .2s;
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .text-btn {
    display: block; margin: 16px auto 0; padding: 10px 18px; border-radius: 999px;
    background: var(--chip); font-weight: 700; font-size: 14.5px;
  }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--track); }
  .row:last-of-type { border-bottom: 0; }
  .row .label { font-weight: 700; font-size: 16px; }
  .row .hint { display: block; font-weight: 500; font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
  .stepper { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .stepper button { width: 38px; height: 38px; border-radius: 50%; background: var(--chip); font-size: 22px; font-weight: 700; line-height: 1; }
  .stepper button:active { background: var(--track); }
  .stepper output { min-width: 62px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }
  .switch { position: relative; width: 54px; height: 32px; border-radius: 999px; background: var(--track); flex-shrink: 0; transition: background .2s; }
  .switch::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%;
    background: #fff; box-shadow: 0 2px 5px rgba(0, 0, 0, .2); transition: transform .2s;
  }
  .switch[aria-checked="true"] { background: var(--accent); }
  .switch[aria-checked="true"]::after { transform: translateX(22px); }
  .note { margin: 14px 0 0; padding: 12px 14px; border-radius: 16px; background: var(--chip); font-size: 13.5px; font-weight: 600; line-height: 1.45; color: var(--ink-soft); }

  .toast {
    position: fixed; z-index: 9; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
    transform: translateX(-50%); max-width: calc(100% - 40px);
    padding: 12px 18px; border-radius: 999px;
    background: rgba(40, 30, 40, .92); color: #fff; font-weight: 700; font-size: 14.5px; text-align: center;
  }
</style>
</head>
<body data-theme="lavender">
<div class="bg bg-lavender" id="bg"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<main class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <path class="cat" d="M20 46L18 16L40 30Q50 27 60 30L82 16L80 46C86 64 72 84 50 84C28 84 14 64 20 46Z"/>
        <path class="cat-line" d="M38 47v8M62 47v8M44 63q3 4 6 0q3 4 6 0"/>
        <path class="cat-whisker" d="M30 61L5 56M30 67L6 72M70 61L95 56M70 67L94 72"/>
      </svg>
      <span>Cat Girls for Impact<small>Timer</small></span>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="openBg" aria-label="Change background">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="4"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M4 17l5-5 4 4 2.5-2.5L20 18"/></svg>
      </button>
      <button class="icon-btn" id="openSettings" aria-label="Settings">

  const LINES = {

        "Claws out, cat girl. This one won't catch itself.",
      ],
    },
  };
  const textOf = (line) => (Array.isArray(line) ? line[0] : line);
  // Lines shown lately are skipped, so the same one doesn't come round again too soon.
  let recent = store.get('catgirls.recent', []);
  if (!Array.isArray(recent)) recent = [];
  function pickLine(kind, remember = true) {
    const list = LINES.cat[kind];
    const fresh = list.filter((line) => !recent.includes(textOf(line)));
    const pool = fresh.length ? fresh : list;
    const line = pool[Math.floor(Math.random() * pool.length)];

      recent.push(picked.text);

  const dayKey = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };

  const FX = [['off', 'Off'], ['stars', 'Stars'], ['snow', 'Snow'], ['petals', 'Petals'], ['bubbles', 'Bubbles'], ['hearts', 'Hearts']];

  const settings = Object.assign(
    { focus: 25, short: 5, long: 15, every: 4, sound: true, auto: false, awake: true, notify: false, theme: 'lavender', fx: 'stars', cheer: true },
    store.get('catgirls.settings', {})
  );
  const state = Object.assign(
    { mode: 'focus', running: false, endAt: 0, remaining: null, cycle: 0, day: dayKey(), today: 0, cheer: '', cheerBy: '' },
    store.get('catgirls.state', {})
  );

  let photo = store.get('catgirls.photo', null);

  const saveSettings = () => store.set('catgirls.settings', settings);
  const saveState = () => store.set('catgirls.state', state);

  // ---------- timer ----------
  const duration = (mode = state.mode) => settings[mode] * 60000;
  const remaining = () => state.running
    ? Math.max(0, state.endAt - Date.now())
    : (state.remaining == null ? duration() : state.remaining);

  // A new day starts fresh: today's count and the hearts both go back to zero.
  // A long break that was earned yesterday but not started is dropped too.
  function rollDay() {
    if (state.day === dayKey()) return false;
    state.day = dayKey(); state.today = 0; state.cycle = 0;
    if (state.mode === 'long' && !state.running) { state.mode = 'focus'; state.remaining = null; }
    saveState();
    return true;
  }

  function start() {
    unlockAudio();
    state.endAt = Date.now() + remaining();
    state.remaining = null;
    state.running = true;
    state.cheer = ''; state.cheerBy = '';
    saveState(); syncWake(); render();
  }
  function pause() {
    state.remaining = remaining();
    state.running = false;
    saveState(); syncWake(); render();
  }
  function reset() {
    state.running = false; state.remaining = null;
    saveState(); syncWake(); render();
  }
  function setMode(mode) {
    if (mode === state.mode && !state.running && state.remaining == null) return;
    state.mode = mode; state.running = false; state.remaining = null;
    saveState(); syncWake(); render();
  }
  // Move to the next step. `finished` is true when the timer ran out, false when skipped.
  function advance(finished) {
    rollDay();
    const was = state.mode;
    if (was === 'focus') {
      if (finished) { state.cycle += 1; state.today += 1; }
      state.mode = state.cycle >= settings.every ? 'long' : 'short';
    } else {
      if (was === 'long') state.cycle = 0;
      state.mode = 'focus';
    }
    state.remaining = null;
    state.running = finished && settings.auto;
    if (state.running) state.endAt = Date.now() + duration();
    const line = finished && settings.cheer ? pickLine(was === 'focus' ? 'done' : 'back') : null;
    state.cheer = line ? line.text : '';
    state.cheerBy = line ? line.by : '';

      playBell();
      notify(was === 'focus' ? 'Focus session done' : 'Break is over',
             line ? (line.by ? '“' + line.text + '” — ' + line.by : line.text)

  const el = {
    time: $('#time'), status: $('#status'), prog: $('#prog'), toggle: $('#toggle'),
    mascot: $('#mascot'), dots: $('#dots'), today: $('#today'), bg: $('#bg'),

  el.dots.addEventListener('click', (e) => {

    el.cheerBy.textContent = state.cheer && state.cheerBy ? '— ' + state.cheerBy : '';

  // ---------- sound, notifications, screen wake ----------
  // How the bell gets played on iPhone:
  // - When the app opens, the bell is recorded into a few short clips (each one jingles a
  //   little differently), so nothing has to be generated at the moment time runs out.
  // - The clips play through one ordinary audio player. iPhone plays that kind of sound even
  //   when the phone is on silent, and once the player has been started by a tap it stays
  //   allowed to play later without another tap, so every timer can ring, not only the first.
  // - The live sound engine is kept as a backup for browsers where the player fails.
  let audio = null, bellReady = false, nextClip = 0, playerUnlocked = false, unlocking = false;
  const bellClips = [];
  const player = new Audio();
  player.setAttribute('playsinline', '');
  player.preload = 'auto';

  function unlockAudio() {

    // trusts it from then on. Being muted, it doesn't pause any music you're listening to.

      try {
        player.muted = true;
        player.src = SILENCE;
        const p = player.play();
        const done = () => { player.pause(); player.muted = false; playerUnlocked = true; unlocking = false; };
        const fail = () => { player.muted = false; unlocking = false; };
        if (p && p.then) p.then(done, fail); else done();
      } catch { player.muted = false; unlocking = false; }
    }

    try {
      if (!audio || audio.state === 'closed') {

        blip.connect(audio.destination); blip.start(0);

    } catch { /* no audio available */ }

    document.addEventListener(type, unlockAudio, { capture: true, passive: true }));

  // The sound when a timer finishes: a soft cat collar bell jingling as a cat scratches its
  // ear. It is synthesized, so no sound file is needed offline. Change these to retune it.
  const BELL = {
    pitch: 2750,    // main ring of the bell's shell, in Hz (higher = smaller bell)
    volume: 0.29,   // overall loudness, 0 to 1
    scratches: 6,   // how many jingle-jingles in the ear scratch
    gap: 0.15,      // seconds between jingles (bigger = slower, more relaxed)
    loose: 1.1,     // how loosely the little ball bounces inside (bigger = slower rattle)
    clips: 4,       // how many different takes to record when the app opens
  };
  // Shared effects: cut the low rumble, take the edge off the very top, add a small room echo.

      if (r.hint) { const h = document.createElement('span'); h.className = 'hint'; h.textContent = r.hint; label.appendChild(h); }

  backdrop.addEventListener('click', hide);
  document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', hide));
  $('#openBg').addEventListener('click', () => { buildSwatches(); show($('#bgSheet')); });
  $('#openSettings').addEventListener('click', () => { buildSettings(); show($('#settingsSheet')); });

  let toastTimer = 0;
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
  }

  // ---------- controls ----------
  el.toggle.addEventListener('click', () => (state.running ? pause() : start()));
  $('#reset').addEventListener('click', reset);
  $('#skip').addEventListener('click', () => advance(false));
  document.querySelector('.tabs').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-mode]'); if (b) setMode(b.dataset.mode);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { hide(); return; }
    if (e.code === 'Space' && !openSheet && !e.target.closest('button, input')) {
      e.preventDefault(); state.running ? pause() : start();
    }
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); render(); syncWake(); } });
  window.addEventListener('pageshow', () => { tick(); render(); });

  // ---------- go ----------
  applyTheme();
  fx.set(settings.fx);
  render();
  tick();
  setInterval(tick, 250);
  syncWake();

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
